name: Build Branch

on:
  push:
    branches:
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build gms mobile arm64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --console=plain assembleGmsMobileArm64Debug
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: "true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-gms-mobile-arm64-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/gms/mobile/arm64/debug/*.apk
            app/build/outputs/apk/gmsMobileArm64/debug/*.apk
            app/build/outputs/apk/mobile/arm64/debug/*.apk
          if-no-files-found: error
